name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build inspector
        run: pnpm --filter @gmsim/web... build

  engine-tests:
    runs-on: ubuntu-latest
    # Shard 2 of the old 4-way split outgrew the 45-minute cap on 2026-06-11,
    # and every CI run from then to v0.169 concluded "cancelled" — silently,
    # because a timeout renders as neutral grey, not a red X. `ci-green`
    # below turns any timeout red. The gate-optimization pass (2026-07-04)
    # broke up the wall-clock anchors — mood 42min (log-only instruments
    # skipped + long-horizon split to its own file), retirement 17min and
    # advance 16min (per-test walks consolidated into shared per-season
    # trajectories) — so the worst shard now measures well under 20 minutes;
    # 45 keeps >2× headroom. If a shard times out, a heavy file has regrown:
    # split or consolidate it rather than raising the cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run engine suite (shard ${{ matrix.shard }}/8)
        # `pnpm test --shard=…` would be eaten by pnpm's own option parser;
        # `pnpm exec` forwards flags to vitest verbatim. The JSON report
        # feeds the timing-audit job below.
        run: pnpm --filter @gmsim/engine exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=json --outputFile=vitest-report-shard-${{ matrix.shard }}.json

      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-timings-${{ matrix.shard }}
          path: packages/engine/vitest-report-shard-*.json
          retention-days: 30

  # Advisory (never blocks ci-green): compares per-file / per-module / total
  # test durations against scripts/test-timings.baseline.json and annotates
  # the run with ::warning:: when anything grew >25% (Daniel's spec,
  # 2026-07-04). The full gate was silently hostage to one 42-minute file —
  # this is the growth alarm so it can't happen quietly again. Refresh the
  # baseline deliberately with `--write-baseline` after accepted changes.
  timing-audit:
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download shard timing reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-timings-*
          merge-multiple: true
          path: timing-reports

      - name: Audit test timings vs baseline
        run: |
          node scripts/test-timing-audit.mjs timing-reports/vitest-report-shard-*.json | tee audit.txt
          { echo '### Test-timing audit'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Single required signal. A job that hits `timeout-minutes` concludes
  # "cancelled", which GitHub renders as ignorable grey — 15 straight runs
  # (2026-06-11 → 2026-07-01) went unnoticed that way. This job goes RED
  # unless every job above actually succeeded.
  ci-green:
    runs-on: ubuntu-latest
    needs: [typecheck, build-web, engine-tests]
    if: always()
    steps:
      - name: All jobs succeeded
        run: |
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.build-web.result }}" = "success"
          test "${{ needs.engine-tests.result }}" = "success"
