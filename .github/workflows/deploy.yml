name: Deploy inspector + game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build inspector
        # `...` includes workspace dependencies so packages/engine builds
        # first — without it the web tsc step fails because the engine's
        # dist/*.d.ts (referenced via tsconfig project refs) hasn't been
        # emitted yet.
        run: pnpm --filter @gmsim/web... build

      - name: Build game
        # Same `...` requirement as the inspector above.
        run: pnpm --filter @gmsim/game... build

      - name: Assemble Pages site
        # The inspector keeps the root URL it has always had; the game is
        # served from /game/ (GAME_UI_FOUNDATION.md D3/D5 — "a second Pages
        # entry (or a subpath build)"). Both apps build with `base: './'`,
        # so relative asset paths resolve correctly under either prefix.
        run: |
          rm -rf _site
          mkdir -p _site/game
          cp -r apps/web/dist/. _site/
          cp -r apps/game/dist/. _site/game/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
